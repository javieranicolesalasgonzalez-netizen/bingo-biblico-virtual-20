# Bingo Bíblico Virtual — despliegue gratuito. La base Postgres ya existe en Render.
services:
  - type: web
    name: bingo-biblico-20
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bingo-biblico-db-gratis
          property: connectionString
