# Plan gratuito de Render. Debe usarse con PostgreSQL externo persistente (p. ej. Supabase Free).
services:
  - type: web
    name: bingo-biblico-virtual
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: NODE_VERSION
        value: 22
